name: Publish CLI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade NPM for OIDC
        run: npm install -g npm@latest

      - name: Inject Telemetry Key
        run: sed -i "s/___POSTHOG_INGESTION_KEY___/${{ secrets.POSTHOG_KEY }}/g" src/core/telemetry.js
        
      - name: Install dependencies
        run: npm install

      # --- Phase 1: Static Generation Validation ---
      - name: Run Unit & Snapshot Tests
        run: npm test

      # --- Phase 2: Execution & Security Validation ---
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint across Terraform files
        run: tflint --recursive || true

      - name: Run Trivy IaC Config Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-dir: '.'
          format: 'table'
          exit-code: '0' 
      
      # --- Phase 3: Publish ---
      - name: Publish to NPM
        run: npm publish --provenance